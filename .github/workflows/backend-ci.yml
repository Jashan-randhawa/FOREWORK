name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    name: Test & Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/forework_ci
      JWT_SECRET: ci_test_secret_key_please_change
      FRONTEND_URL: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Dependency audit (fails on high/critical vulnerabilities)
        run: npm audit --audit-level=high
        continue-on-error: false

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t forework-backend:ci .
