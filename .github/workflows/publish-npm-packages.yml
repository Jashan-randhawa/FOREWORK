name: Publish npm Package to GitHub Packages

on:
  push:
    branches: [main]
    paths:
      - "packages/ats-predictor/**"
      - ".github/workflows/publish-npm-packages.yml"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-ats-predictor:
    name: Test & Publish @jashan-randhawa/ats-predictor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@jashan-randhawa"

      - name: Install dependencies
        working-directory: ./packages/ats-predictor
        run: npm ci

      - name: Run unit tests
        working-directory: ./packages/ats-predictor
        run: npm test

      - name: Publish package to GitHub Packages npm Registry
        working-directory: ./packages/ats-predictor
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
